name: CI

on:
  pull_request:
  push:
    branches: [main, "phase-*/**"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API (ruff, mypy, pytest)
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16.15-bookworm@sha256:d81f7b51697014367236d07ec58b54153fc28f828b72bf247fe5c7487520bcb0
        env:
          POSTGRES_USER: askspore
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: askspore
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U askspore"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      TEST_ADMIN_DATABASE_URL: postgresql://askspore:ci-only-password@localhost:5432/postgres
      REQUIRE_DB_TESTS: "1"
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.11.32"
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy app
      - run: uv run pytest

  eval:
    name: Eval (ruff, mypy, pytest, eval sets)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: packages/eval
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.11.32"
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest
      - name: Eval gate (committed runs against results/BASELINE, P1b-15 b)
        run: |
          uv run python -m eval gate --output "$RUNNER_TEMP/gate.md"
          status=$?
          cat "$RUNNER_TEMP/gate.md" >> "$GITHUB_STEP_SUMMARY"
          exit $status
      - name: Validate eval sets
        run: |
          uv run python -m eval validate sets/synthetic-v0.jsonl --min-items 30 --min-out-of-corpus 6
          if [ -f sets/v1.jsonl ]; then uv run python -m eval validate sets/v1.jsonl; fi

  workflows:
    # Every workflow, eval.yml included, must be valid without any secret defined.
    name: Workflows (actionlint)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: actionlint
        env:
          VERSION: 1.7.12
          SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          curl -sSfL -o "$RUNNER_TEMP/actionlint.tgz" \
            "https://github.com/rhysd/actionlint/releases/download/v${VERSION}/actionlint_${VERSION}_linux_amd64.tar.gz"
          echo "$SHA256  $RUNNER_TEMP/actionlint.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/actionlint.tgz" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -color

  web:
    name: Web (eslint, prettier, tsc, vitest)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: apps/web/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22.22.0"
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Client types match apps/api/openapi.json
        run: pnpm gen:api && git diff --exit-code src/api/schema.d.ts
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - name: The component gallery is left out of the production build (UX-06)
        run: pnpm build && ! grep -rqF ui-gallery dist
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e

  web-visual:
    # UX-05 (design/specs/ux-refresh-spec.md): the visual-regression suite, in the same pinned
    # Playwright image that generates the snapshots (apps/web/e2e/visual/run-in-image.sh).
    name: Web visual regression (pinned Playwright image)
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble@sha256:eff16c30e6f3f4af0a03fa4b706120d5e9b0891c344a27d64559aff5900a4a27
      options: --ipc=host
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: apps/web/package.json
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright test --config playwright.visual.config.ts
      - name: Diff images of a failed comparison
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: visual-diffs
          path: apps/web/test-results/
          retention-days: 7

  authentik-blueprint:
    # P1b-08: the blueprint applies to an empty Authentik of the pinned version and gives
    # what the API relies on. A throwaway instance: secrets generated here, nothing kept.
    name: Authentik blueprint (empty instance)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: infra/authentik
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Throwaway secrets
        run: |
          db="$(openssl rand -hex 24)"
          {
            echo "POSTGRES_PASSWORD=${db}"
            echo "AUTHENTIK_POSTGRESQL__PASSWORD=${db}"
            echo "AUTHENTIK_SECRET_KEY=$(openssl rand -hex 32)"
          } > .env
      - name: Start Authentik
        # One container at a time: the server and the worker share the fresh volume
        # authentik_data, and Docker refuses to populate it twice at once ("failed to
        # create symlink ... media: file exists").
        run: |
          docker compose --profile auth up -d --wait authentik-postgresql
          docker compose --profile auth up -d --no-deps authentik-server
          sleep 10
          docker compose --profile auth up -d --no-deps authentik-worker
      - name: Wait until Authentik is ready
        run: |
          for _ in $(seq 1 90); do
            if curl -fsS -o /dev/null http://127.0.0.1:9000/-/health/ready/; then exit 0; fi
            sleep 5
          done
          echo "Authentik did not become ready"; exit 1
      - name: Wait for Authentik's own blueprints (ours depends on three)
        # The code goes in on stdin: the image's `ak` wrapper re-splits its arguments, so a
        # `shell -c` program with spaces would not survive it.
        run: |
          for _ in $(seq 1 60); do
            if docker compose --profile auth exec -T authentik-worker ak shell \
                < blueprints/wait_for_defaults.py; then
              exit 0
            fi
            sleep 5
          done
          echo "Authentik's default blueprints were not applied"; exit 1
      - name: Validate the blueprint (dry run)
        run: docker compose --profile auth exec -T authentik-worker ak apply_blueprint --dry-run custom/ask-spore.yaml
      - name: Apply the blueprint
        run: docker compose --profile auth exec -T authentik-worker ak apply_blueprint custom/ask-spore.yaml
      - name: Apply it again (idempotent)
        run: docker compose --profile auth exec -T authentik-worker ak apply_blueprint custom/ask-spore.yaml
      - name: Check the result
        run: docker compose --profile auth exec -T authentik-worker ak shell < blueprints/verify_blueprint.py
      - name: Authentik logs on failure
        if: failure()
        run: docker compose --profile auth logs --tail 200 authentik-server authentik-worker

  compose:
    name: Compose config
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: cp infra/ragflow/.env.example infra/ragflow/.env
      - run: docker compose -f infra/compose.dev.yml config --quiet
      - name: No floating image tags
        run: |
          if docker compose -f infra/compose.dev.yml config --images | grep -Ev ':[^:]+$' | grep -Ev '^ask-spore-dev-'; then
            echo "untagged image"; exit 1
          fi
          if docker compose -f infra/compose.dev.yml config --images | grep -E ':latest$'; then
            echo "floating :latest tag"; exit 1
          fi
      - name: Deploy script dry run (P1c-10)
        # compose config with every profile, then the image-digest check against the
        # registries; a moved tag or an unreachable registry fails the job (fail closed).
        run: bash infra/scripts/deploy.sh --dry-run

# Regenerates the visual-regression baselines (apps/web/e2e/visual/__screenshots__) in the same
# pinned Playwright image CI compares them in, for a change that moves pixels on purpose (the
# footer of P2A-L1). The snapshots must come from this image: a developer machine's fonts and
# browser build differ and would fail the web-visual job.
#
# Manual: Actions -> Visual baselines -> Run workflow on the branch (or add the label
# `update-visual-baselines` to a pull request from this repository).
#
# It does not push to the branch itself: a push made with the workflow token starts no CI run,
# so the new head would have no checks. It pushes the snapshots to a throwaway branch
# `visual-baselines/<run id>`; a person (or Claude) fetches that branch, commits the
# `__screenshots__` folder on the pull request branch with their own credentials, so CI runs on
# the result, and deletes the throwaway branch.

name: Visual baselines

on:
  workflow_dispatch:
  pull_request:
    types: [labeled]

permissions:
  contents: write

concurrency:
  group: visual-baselines-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  update:
    name: Update the baselines (pinned Playwright image)
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.label.name == 'update-visual-baselines' &&
      github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble@sha256:eff16c30e6f3f4af0a03fa4b706120d5e9b0891c344a27d64559aff5900a4a27
      options: --ipc=host
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: apps/web/package.json
      - run: pnpm install --frozen-lockfile
      - name: Regenerate the snapshots
        run: pnpm exec playwright test --config playwright.visual.config.ts --update-snapshots
      - name: They now pass without updating
        run: pnpm exec playwright test --config playwright.visual.config.ts
      - name: Push the snapshots to a throwaway branch
        env:
          BRANCH: visual-baselines/${{ github.run_id }}
        run: |
          command -v git >/dev/null || { apt-get update -qq && apt-get install -y -qq git; }
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add e2e/visual/__screenshots__
          if git diff --cached --quiet; then
            echo "The baselines are already current; nothing to push."
            exit 0
          fi
          git diff --cached --stat | tail -n 5
          git commit -q -m "Visual baselines regenerated in the pinned Playwright image"
          git push origin "HEAD:refs/heads/$BRANCH"
          echo "Snapshots pushed to $BRANCH" >> "$GITHUB_STEP_SUMMARY"

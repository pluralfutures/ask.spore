[project]
name = "ask-spore-api"
version = "0.0.0"
description = "ask.spore platform API and workers"
requires-python = ">=3.12,<3.13"
# Minor versions pinned per design/Stack Decision.md; exact versions live in uv.lock.
dependencies = [
    "fastapi~=0.143.3",
    "httpx~=0.28.1",
    "pydantic~=2.14.1",
    "redis~=8.1.0",
    "sqlalchemy[asyncio]~=2.1.5",
    # Readable-text extraction for crawled pages (P0-10).
    "trafilatura~=2.3.1",
    "asyncpg~=0.32.0",
    "alembic~=1.20.0",
    "mistralai~=2.10.1",
    # Scaleway Generative APIs through its OpenAI-compatible endpoint (Stack Decision).
    "openai~=3.24.0",
    "uvicorn[standard]~=0.54.0",
    # OIDC token validation (P1a-02): signature, issuer, audience and expiry against JWKS.
    "pyjwt[crypto]~=2.15.1",
    # File uploads in the content console (P1b-05): FastAPI reads multipart forms with it.
    "python-multipart~=0.0.32",
    # Token counts for the history and context caps (P1b-15 f): the DeepSeek V4 tokenizer,
    # pure Python with its tokenizer.json in the wheel, so it works offline.
    "deepseek-tokenizer~=0.3.0",
]

[project.scripts]
# Content operations: datasets sync (P0-08), ingest (P0-09), crawl (P0-10).
ask-spore = "app.cli:main"

[build-system]
requires = ["uv_build==0.11.32"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy~=2.4.0",
    "pytest~=9.1.1",
    "pytest-asyncio~=1.4.0",
    # Reads the Authentik blueprint in its structure test (P1b-08).
    "pyyaml~=6.0.3",
    "ruff~=0.17.1",
]

[tool.uv]
package = true

[tool.uv.build-backend]
# The import package is "app", at the project root (no src/ layout).
module-name = "app"
module-root = ""

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "T20", "ASYNC", "RUF"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Header",
    "fastapi.Form",
    "fastapi.File",
]

[tool.ruff.lint.isort]
known-third-party = ["alembic"]

[tool.ruff.lint.per-file-ignores]
# Tests use synthetic credentials and build SQL from constant table names.
"tests/**" = ["S101", "S105", "S106", "S608"]
# Migrations build DDL from module constants, never from input.
"alembic/versions/**" = ["S608"]

[tool.mypy]
strict = true
python_version = "3.12"
files = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "integration: needs the Compose services (RAGFlow); not run in unit CI",
]
addopts = "-m 'not integration'"
filterwarnings = ["error"]

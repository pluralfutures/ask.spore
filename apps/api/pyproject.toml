[project]
name = "ask-spore-api"
version = "0.0.0"
description = "ask.spore platform API and workers"
requires-python = ">=3.12,<3.13"
# Minor versions pinned per design/Stack Decision.md; exact versions live in uv.lock.
dependencies = [
    "fastapi~=0.143.3",
    "pydantic~=2.14.1",
    "uvicorn[standard]~=0.54.0",
]

[dependency-groups]
dev = [
    "httpx~=0.28.1",
    "mypy~=2.4.0",
    "pytest~=9.1.1",
    "pytest-asyncio~=1.4.0",
    "ruff~=0.17.1",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "T20", "ASYNC", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
strict = true
python_version = "3.12"
files = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "integration: needs the Compose services (RAGFlow); not run in unit CI",
]
addopts = "-m 'not integration'"
filterwarnings = ["error"]

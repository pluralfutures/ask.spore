# Content tags. One RAGFlow dataset per tag (architecture §4.4); the tag-to-dataset
# mapping lives in the `datasets` table, written by `ask-spore datasets sync` (P0-08).
#
# PHASE 0: the single internal tenant's package is every tag listed here. The chat
# orchestrator reads only the table names; per-tag settings (chunking method,
# P0-08) live inside each table.
#
# chunk_method is the RAGFlow chunking method of the tag's dataset. RAGFlow sets it
# per dataset with a per-document override; chunk_method_by_type gives that override
# per source type (pdf, docx, pptx, html, markdown) and is applied at ingestion.

[tags.sample-reports]
# Third-party reports: PDF with "paper". The Phase 0 corpus also has third-party
# DOCX and PPTX files under this tag; they get the methods sample-analysis uses.
chunk_method = "paper"
chunk_method_by_type = { docx = "naive", pptx = "presentation" }

[tags.sample-analysis]
# Own analysis: DOCX with "naive", PPTX with "presentation".
chunk_method = "naive"
chunk_method_by_type = { pptx = "presentation" }

[tags.sample-web]
# Crawled pages, rendered to Markdown.
chunk_method = "naive"

# Test client (P1a-04, owner decision Oct 19, 2026; renamed to the TAG_PATTERN form
# Oct 20, 2026, findings E1). One tag per workspace plus the shared corpus tag; each
# workspace's tag_ids are its own tag + cc-shared (set in the operator console).
# PDF with "paper", PPTX with "presentation", DOCX with "naive".

[tags.cc-team1-healthcare-gpo]
# Workspace "CC Team 1 Healthcare GPO".
chunk_method = "paper"
chunk_method_by_type = { pdf = "paper", pptx = "presentation", docx = "naive" }

[tags.cc-team2-college-universities]
# Workspace "CC Team 2 College & Universities".
chunk_method = "paper"
chunk_method_by_type = { pdf = "paper", pptx = "presentation", docx = "naive" }

[tags.cc-team3-commercial-restaurants]
# Workspace "CC Team 3 Commercial Restaurants".
chunk_method = "paper"
chunk_method_by_type = { pdf = "paper", pptx = "presentation", docx = "naive" }

[tags.cc-shared]
# The test client's common corpus, shared by all three workspaces.
chunk_method = "paper"
chunk_method_by_type = { pdf = "paper", pptx = "presentation", docx = "naive" }

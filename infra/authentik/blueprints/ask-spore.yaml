# yaml-language-server: $schema=https://goauthentik.io/blueprints/schema.json
#
# ask.spore's Authentik configuration (P1b-08): what infra/authentik/README.md describes
# as manual steps, as one blueprint, so a new environment is configured from this file.
# Desk-checked against the version-2026.8 schema; CI applies it to an empty Authentik
# (.github/workflows/ci.yml, job "authentik-blueprint") and checks the result
# (verify_blueprint.py).
#
# Mounted read-only at /blueprints/custom (docker-compose.yml); Authentik's worker applies
# it on start and whenever it changes. Objects are matched by name or slug, so on an
# Instance configured by hand (Phase 1a) it adopts the existing stages, flow, scope
# mapping, provider and application and changes only what differs. Before mounting it on
# such an Instance, run a dry run (README, "Blueprint").
#
# No secret is in this file: the provider's client secret is generated by Authentik on
# creation (copy it to AUTHENTIK_CLIENT_SECRET), and the provisioner's API token key too
# (copy it to AUTHENTIK_API_TOKEN). Names must match [auth.authentik] in
# config/models.toml (tests/test_authentik_blueprint.py checks them).
version: 1
metadata:
  name: ask.spore
  labels:
    blueprints.goauthentik.io/description: "ask.spore sign-in links, tenant SSO sources, admin MFA, provisioner"
entries:
  # --- Authentik's own objects this file refers to: applied first --------------------------
  - model: authentik_blueprints.metaapplyblueprint
    attrs:
      identifiers:
        name: Default - Provider authorization flow (implicit consent)
      required: true
  - model: authentik_blueprints.metaapplyblueprint
    attrs:
      identifiers:
        name: Default - Provider invalidation flow
      required: true
  - model: authentik_blueprints.metaapplyblueprint
    attrs:
      identifiers:
        name: System - OAuth2 Provider - Scopes
      required: true

  # --- 2. Stages of the sign-in-link flow ---------------------------------------------------
  - model: authentik_stages_identification.identificationstage
    id: stage-identification
    identifiers:
      name: ask-spore-identification
    attrs:
      user_fields: [email]
      sources: []
      show_matched_user: false
      pretend_user_exists: true
      case_insensitive_matching: true
  - model: authentik_stages_email.emailstage
    id: stage-email
    identifiers:
      name: ask-spore-email-link
    attrs:
      use_global_settings: true
      template: ask-spore-sign-in.html
      token_expiry: minutes=15
      subject: Sign in to ask.spore
      activate_user_on_success: false
  - model: authentik_stages_user_login.userloginstage
    id: stage-login
    identifiers:
      name: ask-spore-login
    attrs:
      session_duration: hours=8

  # --- 3a. Second factor for tenant admins (P1b-08) ----------------------------------------
  - model: authentik_core.group
    id: group-tenant-admins
    identifiers:
      name: ask-spore-tenant-admins
    attrs:
      is_superuser: false
  - model: authentik_stages_authenticator_totp.authenticatortotpstage
    id: stage-totp-setup
    identifiers:
      name: ask-spore-admin-totp-setup
    attrs:
      digits: "6"
      friendly_name: ask.spore
  - model: authentik_stages_authenticator_validate.authenticatorvalidatestage
    id: stage-admin-mfa
    identifiers:
      name: ask-spore-admin-mfa
    attrs:
      device_classes: [totp]
      not_configured_action: configure
      configuration_stages:
        - !KeyOf stage-totp-setup
      last_auth_threshold: seconds=0

  # --- 3. The sign-in-link flow --------------------------------------------------------------
  - model: authentik_flows.flow
    id: flow-sign-in-link
    identifiers:
      slug: ask-spore-sign-in-link
    attrs:
      name: ask.spore sign-in link
      title: Sign in to ask.spore
      designation: authentication
      authentication: none
  - model: authentik_flows.flowstagebinding
    identifiers:
      target: !KeyOf flow-sign-in-link
      stage: !KeyOf stage-identification
      order: 10
  - model: authentik_flows.flowstagebinding
    identifiers:
      target: !KeyOf flow-sign-in-link
      stage: !KeyOf stage-email
      order: 20
  - model: authentik_flows.flowstagebinding
    id: binding-admin-mfa
    identifiers:
      target: !KeyOf flow-sign-in-link
      stage: !KeyOf stage-admin-mfa
      order: 25
    attrs:
      # The pending user is known only after the email token restores the plan.
      evaluate_on_plan: false
      re_evaluate_policies: true
  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf binding-admin-mfa
      group: !KeyOf group-tenant-admins
      order: 0
  - model: authentik_flows.flowstagebinding
    identifiers:
      target: !KeyOf flow-sign-in-link
      stage: !KeyOf stage-login
      order: 30

  # --- 7a. Flows of every tenant SSO source (P1b-07) -----------------------------------------
  - model: authentik_policies_expression.expressionpolicy
    id: policy-if-sso
    identifiers:
      name: ask-spore-source-if-sso
    attrs:
      expression: |
        # Only usable from a source's callback, never started directly.
        return ak_is_sso_flow
  - model: authentik_stages_user_write.userwritestage
    id: stage-source-write
    identifiers:
      name: ask-spore-source-write
    attrs:
      user_creation_mode: never_create
  - model: authentik_stages_user_write.userwritestage
    id: stage-source-create
    identifiers:
      name: ask-spore-source-create
    attrs:
      user_creation_mode: always_create
      create_users_as_inactive: false
      user_type: external
      user_path_template: ask-spore/sso
  - model: authentik_flows.flow
    id: flow-source-authentication
    identifiers:
      slug: ask-spore-source-authentication
    attrs:
      name: ask.spore source sign-in
      title: Signing in to ask.spore
      designation: authentication
      authentication: require_unauthenticated
  - model: authentik_flows.flowstagebinding
    identifiers:
      target: !KeyOf flow-source-authentication
      stage: !KeyOf stage-source-write
      order: 10
  - model: authentik_flows.flowstagebinding
    identifiers:
      target: !KeyOf flow-source-authentication
      stage: !KeyOf stage-login
      order: 20
  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf flow-source-authentication
      policy: !KeyOf policy-if-sso
      order: 0
  - model: authentik_flows.flow
    id: flow-source-enrollment
    identifiers:
      slug: ask-spore-source-enrollment
    attrs:
      name: ask.spore source enrolment
      title: Signing in to ask.spore
      designation: enrollment
      authentication: require_unauthenticated
  - model: authentik_flows.flowstagebinding
    identifiers:
      target: !KeyOf flow-source-enrollment
      stage: !KeyOf stage-source-create
      order: 10
  - model: authentik_flows.flowstagebinding
    identifiers:
      target: !KeyOf flow-source-enrollment
      stage: !KeyOf stage-login
      order: 20
  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf flow-source-enrollment
      policy: !KeyOf policy-if-sso
      order: 0
  - model: authentik_flows.flow
    identifiers:
      slug: ask-spore-source-pre-authentication
    attrs:
      name: ask.spore source pre-authentication
      title: Signing in to ask.spore
      designation: stage_configuration
      authentication: none

  # --- 4. Scope mapping ------------------------------------------------------------------------
  - model: authentik_providers_oauth2.scopemapping
    id: scope-ask-spore
    identifiers:
      name: ask_spore
    attrs:
      scope_name: ask_spore
      description: ask.spore tenant
      expression: |
        return {
            "ask_spore_tenant": request.user.attributes.get("ask_spore_tenant"),
            "ask_spore_sso": request.user.attributes.get("ask_spore_sso"),
        }

  # --- 5. Provider and 6. application ----------------------------------------------------------
  - model: authentik_providers_oauth2.oauth2provider
    id: provider
    identifiers:
      name: ask-spore
    attrs:
      client_type: confidential
      client_id: ask-spore
      redirect_uris:
        - matching_mode: strict
          url: https://ask-spore.invalid/auth/callback
      grant_types: [authorization_code, refresh_token]
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
      access_token_validity: hours=8
      refresh_token_validity: hours=24
      sub_mode: hashed_user_id
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-email]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-offline_access]]
        - !KeyOf scope-ask-spore
  - model: authentik_core.application
    identifiers:
      slug: ask-spore
    attrs:
      name: ask.spore
      provider: !KeyOf provider
      meta_hide: true

  # --- 7. The provisioner: a service account with an API token ---------------------------------
  - model: authentik_rbac.role
    id: role-provisioner
    identifiers:
      name: ask-spore-provisioner
    attrs:
      permissions:
        # Users and the admin group (P1a-03, P1b-08).
        - authentik_core.view_user
        - authentik_core.add_user
        - authentik_core.change_user
        - authentik_core.view_group
        - authentik_core.add_user_to_group
        - authentik_core.remove_user_from_group
        # Tenant SSO sources, their mappings and SAML key pairs (P1b-07).
        - authentik_flows.view_flow
        - authentik_sources_oauth.view_oauthsource
        - authentik_sources_oauth.add_oauthsource
        - authentik_sources_oauth.change_oauthsource
        - authentik_sources_oauth.delete_oauthsource
        - authentik_sources_oauth.view_oauthsourcepropertymapping
        - authentik_sources_oauth.add_oauthsourcepropertymapping
        - authentik_sources_oauth.change_oauthsourcepropertymapping
        - authentik_sources_oauth.delete_oauthsourcepropertymapping
        - authentik_sources_saml.view_samlsource
        - authentik_sources_saml.add_samlsource
        - authentik_sources_saml.change_samlsource
        - authentik_sources_saml.delete_samlsource
        - authentik_sources_saml.view_samlsourcepropertymapping
        - authentik_sources_saml.add_samlsourcepropertymapping
        - authentik_sources_saml.change_samlsourcepropertymapping
        - authentik_sources_saml.delete_samlsourcepropertymapping
        - authentik_crypto.view_certificatekeypair
        - authentik_crypto.add_certificatekeypair
        - authentik_crypto.change_certificatekeypair
        - authentik_crypto.delete_certificatekeypair
  - model: authentik_core.user
    id: user-provisioner
    identifiers:
      username: ask-spore-provisioner
    attrs:
      name: ask.spore provisioner
      type: service_account
      path: ask-spore/system
      is_active: true
      roles:
        - !KeyOf role-provisioner
  - model: authentik_core.token
    # Created once; re-applying never rotates it. Its key is generated by Authentik.
    state: created
    identifiers:
      identifier: ask-spore-provisioner-api
    attrs:
      intent: api
      user: !KeyOf user-provisioner
      expiring: false
      description: AUTHENTIK_API_TOKEN of the ask.spore API

# Local development stack: Postgres, Redis, API, the ingestion worker, web dev server, the pinned
# RAGFlow tier from infra/ragflow/ and, with the `auth` profile, Authentik from
# infra/authentik/ (P1a-02).
#
#   cp infra/ragflow/.env.example infra/ragflow/.env   # set passwords
#   docker compose -f infra/compose.dev.yml up -d
#   # sign-in links: cp infra/authentik/.env.example infra/authentik/.env, then
#   docker compose -f infra/compose.dev.yml --profile auth up -d
#
#   # one public host with TLS (Phase 1a release): docker compose ... up -d caddy
#
# Host ports bind to 127.0.0.1 only, except Caddy's 80 and 443 (profile `public`).
# RAGFlow publishes only its web UI; the API
# reaches RAGFlow's HTTP API over the `ragflow` network.

name: ask-spore-dev

include:
  - path: ./ragflow/docker-compose.yml
    env_file: ./ragflow/.env
  - path: ./authentik/docker-compose.yml

services:
  postgres:
    image: postgres:16.15-bookworm@sha256:d81f7b51697014367236d07ec58b54153fc28f828b72bf247fe5c7487520bcb0
    environment:
      POSTGRES_DB: askspore
      POSTGRES_USER: askspore
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-askspore-dev}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:-askspore-app-dev}
    ports:
      - 127.0.0.1:${POSTGRES_PORT:-5432}:5432
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/10-app-role.sh:/docker-entrypoint-initdb.d/10-app-role.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U askspore -d askspore"]
      interval: 5s
      timeout: 5s
      retries: 30
    networks:
      - app
    restart: unless-stopped

  redis:
    image: redis:7.4.11-alpine@sha256:57e4255cc971b1c8d6f8a6ca283ac01bc3ecdd914273ef6bfaede87aaecd6541
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - 127.0.0.1:${REDIS_PORT:-6379}:6379
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 30
    networks:
      - app
    restart: unless-stopped

  # One-shot: apply Alembic migrations as the schema owner, then exit.
  migrate:
    build:
      context: ../apps/api
    command: ["alembic", "upgrade", "head"]
    env_file:
      # PHASE0_INTERNAL_USERS (seeded internal users).
      - path: ../.env
        required: false
    environment:
      MIGRATIONS_DATABASE_URL: postgresql+asyncpg://askspore:${POSTGRES_PASSWORD:-askspore-dev}@postgres:5432/askspore
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - app
    restart: "no"

  api:
    build:
      context: ../apps/api
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      # The LLM provider's key (MISTRAL_API_KEY or SCALEWAY_API_KEY), RAGFLOW_API_KEY, and
      # the auth mode's secrets (PHASE0_BEARER_TOKEN, or AUTHENTIK_CLIENT_SECRET and
      # AUTHENTIK_API_TOKEN). If absent, the API exits at startup and names the missing
      # variables (app.core.config).
      - path: ../.env
        required: false
    environment:
      ASK_SPORE_CONFIG_DIR: /srv/config
      # P1b-13 (e): the deployed commit, in the answer cache key so a deploy never serves
      # answers cached by the previous code. Deploy with
      # ASK_SPORE_DEPLOY_VERSION=$(git rev-parse --short=12 HEAD) docker compose ... up -d;
      # unset, the API uses a hash of its config and code instead.
      ASK_SPORE_DEPLOY_VERSION: ${ASK_SPORE_DEPLOY_VERSION:-}
      DATABASE_URL: postgresql+asyncpg://askspore_app:${APP_DB_PASSWORD:-askspore-app-dev}@postgres:5432/askspore
      REDIS_URL: redis://redis:6379/0
    volumes:
      - ../config:/srv/config:ro
      # Our own copies of ingested PDF, DOCX and PPTX files ([files] content_root, P1a-14),
      # served as downloads; `ask-spore ingest-manifest` (run in this container) stages
      # proposed files here for the worker (P1b-02).
      - content:/srv/ask-spore/content
    ports:
      - 127.0.0.1:${API_PORT:-8000}:8000
    networks:
      - app
      - ragflow
      - authentik  # http://authentik-server:9000, on this network only
    restart: unless-stopped

  # Background jobs (P1b-02): ingestion of approved sources, withdrawals and site crawls
  # (P1b-04), one job at a time, from the `jobs` table; it also queues the crawls that are
  # due. Same image, configuration and secrets as the API; no published port and no HTTP
  # server, so the image's API healthcheck is turned off here. Crawls go out to the
  # public internet over the `app` network, public addresses only (app.content.fetch).
  worker:
    build:
      context: ../apps/api
    command: ["ask-spore", "worker"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      # The withdrawal job purges tenants' answer caches (P1b-03).
      redis:
        condition: service_healthy
    env_file:
      - path: ../.env
        required: false
    environment:
      ASK_SPORE_CONFIG_DIR: /srv/config
      # P1b-13 (e): the deployed commit, in the answer cache key so a deploy never serves
      # answers cached by the previous code. Deploy with
      # ASK_SPORE_DEPLOY_VERSION=$(git rev-parse --short=12 HEAD) docker compose ... up -d;
      # unset, the API uses a hash of its config and code instead.
      ASK_SPORE_DEPLOY_VERSION: ${ASK_SPORE_DEPLOY_VERSION:-}
      DATABASE_URL: postgresql+asyncpg://askspore_app:${APP_DB_PASSWORD:-askspore-app-dev}@postgres:5432/askspore
      REDIS_URL: redis://redis:6379/0
    volumes:
      - ../config:/srv/config:ro
      # Reads the files staged at proposal; writes crawled pages and their raw HTML
      # snapshots, and deletes withdrawn copies ([files] content_root).
      - content:/srv/ask-spore/content
    healthcheck:
      disable: true
    # SIGTERM puts the running job back on the queue; give it time to do so.
    stop_grace_period: 30s
    networks:
      - app
      - ragflow
    restart: unless-stopped

  web:
    build:
      context: ../apps/web
      dockerfile: Dockerfile.dev
    depends_on:
      api:
        condition: service_healthy
    environment:
      # Vite proxies /api to the API on the Compose network (apps/web/vite.config.ts).
      API_PROXY_TARGET: http://api:8000
    ports:
      - 127.0.0.1:${WEB_PORT:-5173}:5173
    volumes:
      - ../apps/web/src:/srv/web/src:ro
      - ../apps/web/index.html:/srv/web/index.html:ro
      - ../apps/web/public:/srv/web/public:ro
      - ../apps/web/vite.config.ts:/srv/web/vite.config.ts:ro
      - ../apps/web/tsconfig.json:/srv/web/tsconfig.json:ro
      - ../apps/web/tsconfig.app.json:/srv/web/tsconfig.app.json:ro
      - ../apps/web/tsconfig.node.json:/srv/web/tsconfig.node.json:ro
    networks:
      - app
    restart: unless-stopped

  # Phase 1a release (profile `public`, started with `up -d caddy`): one-shot production
  # web build into `web_dist`, then Caddy with automatic TLS on 80 and 443. The only
  # ports on all interfaces; every other service stays on loopback or internal networks.
  web-build:
    profiles: ["public"]
    build:
      context: ../apps/web
      dockerfile: Dockerfile
    volumes:
      - web_dist:/out
    restart: "no"

  caddy:
    profiles: ["public"]
    image: caddy:2.11.7-alpine@sha256:eb4d35b7452d1ab6171fbdbe8d9275b2301dad6dad92115d91e19fb9b24d510f
    depends_on:
      web-build:
        condition: service_completed_successfully
      api:
        condition: service_healthy
    ports:
      - 80:80
      - 443:443
      - 443:443/udp
    environment:
      # P2A-11: "published" serves the trust page at /trust; anything else but the
      # default stops Caddy at start. Set in infra/.env by the owner (paperwork item 4).
      ASKSPORE_TRUST_PAGE: ${ASKSPORE_TRUST_PAGE:-unpublished}
      # P2A-L2: "published" serves /legal and the privacy notice, AI transparency note and
      # Terms of Use under it; anything else but the default stops Caddy at start. Set in
      # infra/.env by the owner once counsel has signed the three texts.
      ASKSPORE_LEGAL: ${ASKSPORE_LEGAL:-unpublished}
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - web_dist:/srv/web:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - app
    restart: unless-stopped

volumes:
  postgres_data:
  content:
  web_dist:
  caddy_data:
  caddy_config:

networks:
  app:
    driver: bridge

# Drill only (P1b-16, release runbook 2.4, generic OIDC): a throwaway Keycloak as the
# test tenant's IdP on idp-test.askspore.myceliumgastronomy.com. Used as an override of
# infra/compose.dev.yml; never part of a deploy. Removed after the drill with its volume
# (README.md here). Secrets live outside the repository in /srv/ask-spore/drills/
# (setup.py writes them, root only).
services:
  idp-test-keycloak:
    profiles: ["drill"]
    image: quay.io/keycloak/keycloak:26.7.5@sha256:37dbaf6f0722c9ec246335f36e1ef8b2e6cb960f7c27e0d8c615121a3d475a85
    command: ["start", "--import-realm"]
    env_file:
      - path: /srv/ask-spore/drills/keycloak.env  # KC_BOOTSTRAP_ADMIN_USERNAME/PASSWORD
    environment:
      KC_DB: dev-file
      KC_HOSTNAME: https://idp-test.askspore.myceliumgastronomy.com
      KC_HTTP_ENABLED: "true"
      KC_PROXY_HEADERS: xforwarded
      KC_HEALTH_ENABLED: "true"
    volumes:
      - keycloak_drill:/opt/keycloak/data
      - /srv/ask-spore/drills/realm:/opt/keycloak/data/import:ro
    networks:
      - app
    restart: "no"

  # Caddy serves the drill host as well, from a Caddyfile that imports the production one.
  caddy:
    command: ["caddy", "run", "--config", "/etc/caddy/drill/Caddyfile", "--adapter", "caddyfile"]
    volumes:
      # Relative to infra/, the first compose file's directory.
      - ./drills/keycloak/Caddyfile:/etc/caddy/drill/Caddyfile:ro

volumes:
  keycloak_drill:

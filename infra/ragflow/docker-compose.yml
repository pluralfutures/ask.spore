# RAGFlow retrieval tier, pinned to the version in ./VERSION.
#
# Derived from the official RAGFlow Compose files at that tag
# (docker/docker-compose.yml + docker/docker-compose-base.yml). Differences from
# upstream are deliberate and listed in ./README.md; re-apply them when upgrading.
#
# No service publishes a port to the host except the RAGFlow web UI, which binds
# to 127.0.0.1 for the content editor's spot checks. Everything else, including
# the RAGFlow HTTP API on 9380, is reachable only on the `ragflow` Compose network.

services:
  ragflow-es:
    image: elasticsearch:8.11.3
    volumes:
      - ragflow_esdata:/usr/share/elasticsearch/data
    tmpfs:
      - /tmp:mode=1777,size=512m
    environment:
      - node.name=ragflow-es
      - ELASTIC_PASSWORD=${ELASTIC_PASSWORD:?set ELASTIC_PASSWORD in infra/ragflow/.env}
      - bootstrap.memory_lock=false
      - discovery.type=single-node
      - xpack.security.enabled=true
      - xpack.security.http.ssl.enabled=false
      - xpack.security.transport.ssl.enabled=false
      - cluster.routing.allocation.disk.watermark.low=5gb
      - cluster.routing.allocation.disk.watermark.high=3gb
      - cluster.routing.allocation.disk.watermark.flood_stage=2gb
      - TZ=${TZ:-Europe/Paris}
    mem_limit: ${MEM_LIMIT:-8073741824}
    ulimits:
      memlock:
        soft: -1
        hard: -1
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200 >/dev/null"]
      interval: 10s
      timeout: 10s
      retries: 120
    networks:
      - ragflow
    restart: unless-stopped

  ragflow-mysql:
    image: mysql:8.0.40
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_PASSWORD:?set MYSQL_PASSWORD in infra/ragflow/.env}
      - TZ=${TZ:-Europe/Paris}
    command:
      --max_connections=1000
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --default-authentication-plugin=mysql_native_password
      --tls_version="TLSv1.2,TLSv1.3"
      --init-file /data/application/init.sql
      --binlog_expire_logs_seconds=604800
    volumes:
      - ragflow_mysql:/var/lib/mysql
      - ./init.sql:/data/application/init.sql:ro
    networks:
      - ragflow
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -uroot -p\"$$MYSQL_ROOT_PASSWORD\""]
      interval: 10s
      timeout: 10s
      retries: 120
    restart: unless-stopped

  ragflow-minio:
    image: pgsty/silo:RELEASE.2026-08-06T00-00-00Z
    command: ["server", "--console-address", ":9001", "/data"]
    environment:
      - MINIO_ROOT_USER=${MINIO_USER:?set MINIO_USER in infra/ragflow/.env}
      - MINIO_ROOT_PASSWORD=${MINIO_PASSWORD:?set MINIO_PASSWORD in infra/ragflow/.env}
      - TZ=${TZ:-Europe/Paris}
    volumes:
      - ragflow_minio:/data
    networks:
      - ragflow
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 10s
      retries: 120
    restart: unless-stopped

  ragflow-redis:
    image: valkey/valkey:8.1.10
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD:?set REDIS_PASSWORD in infra/ragflow/.env}
      - --maxmemory
      - 128mb
      - --maxmemory-policy
      - volatile-lru
    volumes:
      - ragflow_redis:/data
    networks:
      - ragflow
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDISCLI_AUTH\" ping | grep -q PONG"]
      interval: 10s
      timeout: 10s
      retries: 120
    environment:
      - REDISCLI_AUTH=${REDIS_PASSWORD}
    restart: unless-stopped

  # Self-hosted embedding service. The RAGFlow image does not bundle an embedding
  # model (see design/specs/phase-0-findings.md); upstream ships this as the
  # optional `tei-cpu` profile, here it is always on.
  # --max-batch-tokens sizes TEI's warm-up batch and with it the memory it keeps
  # resident: with bge-m3 on CPU, 4096 -> ~4.1 GiB, 8192 -> ~10.4 GiB, upstream's
  # default 16384 -> killed above 15 GiB (findings R2).
  ragflow-tei:
    image: infiniflow/text-embeddings-inference:cpu-1.8
    hostname: tei
    command:
      - --model-id
      - /data/${TEI_MODEL:-BAAI/bge-m3}
      - --auto-truncate
      - --max-batch-tokens
      - "${TEI_MAX_BATCH_TOKENS:-4096}"
    networks:
      - ragflow
    restart: unless-stopped

  ragflow:
    image: infiniflow/ragflow:v0.27.2
    depends_on:
      ragflow-es:
        condition: service_healthy
      ragflow-mysql:
        condition: service_healthy
      ragflow-minio:
        condition: service_healthy
      ragflow-redis:
        condition: service_healthy
    command:
      - --enable-adminserver
      - --init-model-provider-tables
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
      nproc:
        soft: 65535
        hard: 65535
    # Web UI only, loopback only. The UI's nginx also proxies RAGFlow's /api/ paths,
    # so this port must stay on loopback (dev) or behind the firewall (Phase 0 Instance).
    ports:
      - 127.0.0.1:${RAGFLOW_UI_PORT:-8080}:80
    env_file: .env
    environment:
      - DOC_ENGINE=elasticsearch
      - API_PROXY_SCHEME=python
      - ES_HOST=ragflow-es
      - MYSQL_HOST=ragflow-mysql
      - MYSQL_PORT=3306
      - MYSQL_DBNAME=rag_flow
      - MINIO_HOST=ragflow-minio
      - REDIS_HOST=ragflow-redis
      - TEI_HOST=ragflow-tei
      # RAGFlow registers the TEI service as its "Builtin" embedding provider only when
      # COMPOSE_PROFILES contains "tei-" (upstream's profile name). This file has no
      # profiles; the variable is set for that check alone (findings R7).
      - COMPOSE_PROFILES=tei-cpu
      - REGISTER_ENABLED=${REGISTER_ENABLED:-0}
      # CPU host: fewer parallel parse tasks and smaller embedding batches, so DeepDoc
      # OCR does not starve TEI past RAGFlow's hard-coded 30 s embedding timeout
      # (findings R17). Upstream defaults: 5 and 16.
      - MAX_CONCURRENT_TASKS=${MAX_CONCURRENT_TASKS:-2}
      - EMBEDDING_BATCH_SIZE=${EMBEDDING_BATCH_SIZE:-8}
    volumes:
      - ragflow_logs:/ragflow/logs
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:9380/api/v1/system/healthz >/dev/null"]
      interval: 15s
      timeout: 10s
      start_period: 180s
      retries: 20
    networks:
      - ragflow
    restart: unless-stopped

volumes:
  ragflow_esdata:
  ragflow_mysql:
  ragflow_minio:
  ragflow_redis:
  ragflow_logs:

networks:
  ragflow:
    driver: bridge
